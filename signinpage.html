<!DOCTYPE html>
<html lang="en">
<head>

    <form action="#">
            <!-- <fieldset class="field_set"> -->

                    <label for="username" class="lab">Username:</label>

                  </div>

                <label for="email" class="lab_1">Email Address:</label>

            </div> 
                   <br><br>
               <div>
                <label for="password" class="lab">Password:</label>
                <input type="password" placeholder="Password" class="pass">
            </div>
                      <br><br>
                <div>

                <option value="Korea">
                <option value="Senegal">
                <option value="Scotland">
                <option value="Russia">
                <option value="Ethopia">
                <option value="Saudi Arabia">
                <option value="Syria">

            </div>
                <br><br>
            <div>
                <input type="submit" value="Login" class="bar_1">
            </div>

            <div>
                <button class="bar"><a href="#">Use Phonenumber..?</a></button>
            </div>

        </form>
</body>
</html>
